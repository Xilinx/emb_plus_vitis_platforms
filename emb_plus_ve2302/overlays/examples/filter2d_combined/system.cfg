#
# Combined AIE + PL filter2d. One xclbin carrying both implementations:
#
#   AIE path : mm2s -> ai_engine_0 <- Tiler_top / stitcher_top
#   PL path  : filter2d_pl_accel (standalone, m_axi in/out)
#
# The two paths are independent -- the host activates exactly one per run.

[clock]
# PL accelerator. Tiler/stitcher are overridden to 400 MHz on the v++ command
# line (see VPP_LDFLAGS in the Makefile).
defaultFreqHz=299996999

[connectivity]
nk=filter2d_pl_accel:1:filter2d_pl_accel_0
nk=Tiler_top:1
nk=stitcher_top:1
nk=mm2s:1

stream_connect=Tiler_top_1.OutputStream:ai_engine_0.DataIn1
stream_connect=ai_engine_0.DataOut1:stitcher_top_1.InputStream
stream_connect=mm2s_1.str:ai_engine_0.DataIn2

[advanced]
param=compiler.skipTimingCheckAndFrequencyScaling=true
param=compiler.aieTraceProfileStreams=true
param=hw_em.enableProfiling=false
param=compiler.addOutputTypes=hw_export
param=compiler.userPostSysLinkOverlayTcl=../filter2d_aie/post_linker.tcl

[vivado]
# The AIE overlay's directive set is kept in full. filter2d_pl's
# Performance_Explore strategy is dropped: a strategy and explicit per-step
# directives cannot both apply to impl_1.
param=project.writeIntermediateCheckpoints=1
prop=run.impl_1.STEPS.OPT_DESIGN.ARGS.DIRECTIVE=Explore
prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=Explore
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.{STEPS.PHYS_OPT_DESIGN.ARGS.MORE OPTIONS}={-verbose}
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.{STEPS.ROUTE_DESIGN.ARGS.MORE OPTIONS}={-tns_cleanup}
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.{STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.MORE OPTIONS}={-verbose}
